<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Auction Data Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Auction Data Scraper</h1>
        <form class="mt-3 mb-3" method="POST" action="/">
            <div class="input-group">
                <label for="url" class="input-group-text">Enter Auction URL:</label>
                <input type="text" id="url" name="url" class="form-control" required>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody>
                {% for auction in auction_data %}
                <tr>
                    <td>{{ auction.id }}</td>
                    <td>{{ auction.name }}</td>
                    <td>{{ auction.price }}</td>
                    <td><a href="{{ auction.url }}" class="btn btn-primary">Link</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
