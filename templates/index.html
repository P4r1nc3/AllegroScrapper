<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Auction Data Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .btn-container {
            display: flex;
            gap: 8px;
        }
        .link-btn,
        .delete-btn {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }
        .link-btn i,
        .delete-btn i {
            line-height: 1;
        }
        .link-btn {
            background-color: #007bff;
        }
        .delete-btn {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Auction Data Scraper</h1>
        <form class="mt-3 mb-3" method="POST" action="/">
            <div class="input-group">
                <label for="url" class="input-group-text">Enter Auction URL:</label>
                <input type="text" id="url" name="url" class="form-control" required>
                <input type="hidden" name="sort_option" value="{{ current_sort }}">
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>

        <form method="POST" action="/" class="mt-3" id="sortForm">
            <input type="hidden" name="url" value="">
            <div class="input-group">
                <label for="sort_option" class="input-group-text">Sort by:</label>
                <select id="sort_option" name="sort_option" class="form-select">
                    {% for option_key, option_label in sort_options %}
                        <option value="{{ option_key }}" {% if option_key == current_sort %}selected{% endif %}>{{ option_label }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>

        <table class="table">
            <thead>
                <tr>
                     <th>ID</th>
                     <th>Name</th>
                     <th>Price</th>
                     <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for auction in auction_data %}
                <tr>
                     <td>{{ auction.id }}</td>
                     <td>{{ auction.name }}</td>
                     <td>{{ auction.price }}</td>
                     <td class="btn-container">
                        <a href="{{ auction.url }}" class="btn btn-primary link-btn" target="_blank"><i class="fa-solid fa-link"></i></a>
                        <form method="POST" action="/delete/{{ auction.id }}" onsubmit="return confirm('Are you sure you want to delete this auction?');">
                            <button type="submit" class="btn btn-danger delete-btn"><i class="fas fa-times"></i></button>
                        </form>
                     </td>
                </tr>
                {% endfor %}
            </tbody>
         </table>
    </div>
    <script>
        // Get the form and select element by their IDs
        const sortForm = document.getElementById('sortForm');
        const sortSelect = document.getElementById('sort_option');

        // Add an event listener for the 'change' event on the select element
        sortSelect.addEventListener('change', () => {
            // Submit the form when the value of the select element changes
            sortForm.submit();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
