<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Auction Data Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Auction Data Scraper</h1>
        <form class="mt-3 mb-3" method="POST" action="/">
            <div class="input-group">
                <label for="url" class="input-group-text">Enter Auction URL:</label>
                <input type="text" id="url" name="url" class="form-control" required>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>

        <form method="POST" action="/" class="mt-3">
            <input type="hidden" name="url" value="">
            <div class="input-group">
                <label for="sort_option" class="input-group-text">Sort by:</label>
                <select id="sort_option" name="sort_option" class="form-select">
                    {% for option_key, option_label in sort_options %}
                        <option value="{{ option_key }}" {% if option_key == current_sort %}selected{% endif %}>{{ option_label }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="btn btn-primary">Sort</button>
            </div>
        </form>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody>
                {% for auction in auction_data %}
                <tr>
                    <td>{{ auction.id }}</td>
                    <td>{{ auction.name }}</td>
                    <td>{{ auction.price }}</td>
                    <td><a href="{{ auction.url }}" class="btn btn-primary" target="_blank">Link</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
